name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build
        run: |
          touch build.log
          bash build.sh > build.log 2>&1 || echo "build.sh failed"
          tail -n 40 build.log

      - name: Publish log
        if: always()
        run: |
          mkdir -p /tmp/l
          cp build.log /tmp/l/build.log || true
          cd /tmp/l
          git init -q -b ci-log
          git config user.email ci@example.com
          git config user.name ci
          git add .
          git commit -qm log
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log

      - name: Verify APK
        run: test -f build/pantograph-sim.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pantograph-sim-apk
          path: build/pantograph-sim.apk

      - uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: build/pantograph-sim.apk
